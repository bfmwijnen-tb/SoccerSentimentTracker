name: Collect and publish dashboard

# Runs the whole tracker on GitHub's machines and publishes the result to
# GitHub Pages, so the dashboard stays current without anyone installing Node,
# running a terminal, or keeping a machine switched on.

on:
  schedule:
    # Every six hours. RSS feeds only carry a day or two, so collecting on a
    # cadence is what builds the history the trend views need.
    - cron: '0 */6 * * *'
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab
  push:
    branches: [claude/dutch-soccer-sentiment-s3xsr8]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs collect into the same cache at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Turns GitHub Pages on via the API if it is not already enabled.
      # Without this the build succeeds, the dashboard is built, and only the
      # final deploy fails with a bare "404 / Not Found" — which reads like a
      # broken workflow rather than a one-time setting nobody was told to flip.
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The SQLite file carries every document collected so far. Without this
      # each run would start empty and the dashboard could never show more than
      # the last day or two that the feeds still list.
      - name: Restore collected history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: sentiment-db-${{ github.run_id }}
          restore-keys: sentiment-db-

      - run: npm ci

      - name: Collect fixtures and documents
        run: |
          npm run fixtures
          # On a cold cache the timeline would otherwise show only the day or
          # two that RSS still lists; --if-sparse makes this a first-run cost
          # rather than something every scheduled run pays.
          npm run backfill -- --months 6 --if-sparse
          npm run collect -- --days 7

      - name: Check sentiment alerts
        # Optional: set ALERT_WEBHOOK_URL in repository secrets for Slack/Discord.
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: npm run alerts
        continue-on-error: true

      - name: Build the standalone dashboard
        run: |
          npm run export -- --out dist/index.html
          cp dist/index.html dist/stemming.html

      - name: Save collected history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: sentiment-db-${{ github.run_id }}

      # A plain downloadable copy, independent of Pages. If publishing is
      # blocked — Pages disabled, an org policy, a private repo without the
      # right plan — the dashboard is still one click away under the run's
      # Artifacts section, so a run is never a total loss.
      - name: Upload downloadable dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist/stemming.html
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
